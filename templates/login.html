<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Spell Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0d1117;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-letters {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 400%;
            z-index: -1;
        }

        .letter {
            position:relative;
           
            color: rgba(235, 210, 210, 0.788);
            animation: floatUp 20s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh);
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0.2;
            }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            z-index: 1;
            width: 100%;
            max-width: 400px;
        }
        @keyframes floatDown {
    0% { top: -5%; opacity: 1; }
    100% { top: 110%; opacity: 0; }
}

.letter {
    font-weight: bold;
    pointer-events: none;
}
        
    </style>
</head>
<body>

    <!-- Floating letters -->
    <div class="background-letters position-absolute w-100 h-100" style="z-index: -1; overflow: hidden;">
        {% for letter in letters %}
            <div class="letter position-absolute text-white" style="
                top: -5%;
                left: {{ letter.left }}vw;
                font-size: {{ letter.size }}rem;
                animation: floatDown 10s linear infinite;
                animation-delay: {{ letter.delay }}s;">
                {{ letter.char }}
            </div>
        {% endfor %}
    </div>
    

    <!-- Login box -->
    <div class="login-box">
        <h2 class="text-center">Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input class="form-control mb-2" type="text" name="username" placeholder="Username" required>
            <input class="form-control mb-2" type="password" name="password" placeholder="Password" required>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <div class="mt-3 text-center">
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
            <form action="{{ url_for('guest_access') }}" method="post">
                <button class="btn btn-outline-secondary mt-2" type="submit">Continue as Guest</button>
            </form>
        </div>
    </div>

</body>
</html>
